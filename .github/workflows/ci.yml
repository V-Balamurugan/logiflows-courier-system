name: LogiFlows CI Pipeline

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:
    branches:
      - main
      - 'hardening/**'

jobs:
  backend-ci:
    name: Backend Test & Migration Check (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logiflows_user
          POSTGRES_PASSWORD: logiflows_pass
          POSTGRES_DB: logiflows_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Database Migrations & Drift (PostgreSQL 16)
        env:
          DATABASE_URL: postgresql+psycopg://logiflows_user:logiflows_pass@localhost:5432/logiflows_test_db
        run: |
          alembic upgrade head
          alembic check

      - name: Run Pytest Suite with Coverage
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_ci_pipeline_only_not_for_prod_1234567890
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-ci:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc -b

      - name: Run Component & Route Tests (Vitest)
        run: npm test

      - name: Production Build (Vite)
        run: npm run build

  e2e:
    name: Playwright End-to-End Suite
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Seed Demo Database & Start Backend Server
        working-directory: backend
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci_playwright_e2e_secret_key_minimum_32_characters_long
        run: |
          alembic upgrade head
          python -m app.cli seed-demo
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 3
          curl -f http://127.0.0.1:8000/health

      - name: Run Playwright Tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security-audit:
    name: Dependency Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-validation:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose Config
        run: docker compose config -q

  ci-gate:
    name: CI Verification Gate
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, e2e, security-audit, docker-validation]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ] || \
             [ "${{ needs.docker-validation.result }}" != "success" ]; then
            echo "CI pipeline failed one or more required verification gates."
            exit 1
          fi
          echo "All CI verification gates passed successfully."
