name: LogiFlows CI Pipeline

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend Test & Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_ci_pipeline_only_not_for_prod_1234567890
        run: |
          pytest -v

  frontend-ci:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc -b

      - name: Run Component & Route Tests (Vitest)
        run: npm test

      - name: Production Build (Vite)
        run: npm run build
